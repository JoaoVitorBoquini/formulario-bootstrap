<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-body">

        <h1 class="text-center"> Mostra de tecnologia e Inovação</h1>
        <p class="text-center">
            Formulario de inscrição para a participação na mostra
        </p>

        <form action="">
            <input type="hidden" name="tipo_formulario"  minlength="3" maxlength="100" value="mostra_tecnologia">
            <fieldset>
                <legend>Informações Pessoais</legend>
                <div class="row">
                    <div class="col-md-6 col-12">
                        <label for="nome" class="form-label">Nome completo:</label>
                        <input type="text" id="nome" name="nome" class="form-control" required>
                    </div>
                    <div class="col-md-6 col-12">
                        <label for="idade" class="form-label">Idade:</label>
                        <input type="number" id="idade" name="idade" class="form-control" min="14" max="100" step="1" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 col-12">
                        <label for="data" class="form-label">Data de Nascimento:</label>
                        <input type="date" id="data" name="data" class="form-control" required>
                    </div>
                    <div class="col-md-6 col-12">
                        <label for="senha" class="form-label">Senha:</label>
                        <input type="password" id="senha" name="senha" class="form-control" required>
                        <small>Não utilize sua senha real. Este campo é apenas demonstrativo</small>
                    </div>
                </div>

                <fieldset>
                    <div class="row">
                        <div class="col-md-6 col-12">
                            <legend>Informações de Contato</legend>
                            <label for="email" class="form-label">Email:</label>
                            <input type="email" id="email" name="email" class="form-control" required>
                        </div>
                        <div class="col-md-6 col-12">
                            <label for="telefone" class="form-label">Telefone:</label>
                            <input type="tel" id="telefone" name="telefone" class="form-control" placeholder="(11) 99999-9999" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" required>
                        </div>
                    </div>
                </fieldset>
                <fieldset>
                <legend>Informações Adicionais</legend>
                <div class="row">
                <div class="col-12">
                <label for="portfolio" class="form-label">Portfolio:</label>
                <input type="url" id="portfolio" name="portfolio" class="form-control" required>
                </div>
                <div class="col-12">
                    <label for="pesquisa" class="form-label">Pesquisa:</label>
                    <input type="search" id="pesquisa" name="pesquisa" class="form-control" required>
                </div>
                </div>
                </fieldset>

                <fieldset>
                <legend>Disponibilidade</legend>
                <div class="row">
                    <div class="col-md-6 col-12">
                        <label for="mes" class="form-label">Mês:</label>
                        <input type="month" id="mes" name="mes" class="form-control" required>
                    </div>
                    <div class="col-md-6 col-12">
                        <label for="semana" class="form-label">Semana:</label>
                        <input type="week" id="semana" name="semana" class="form-control" required>
                    </div>
                
                    <div class="col-12 col-md-6">
                <label for="horario" class="form-label">Horário:</label>
                <input type="time" id="horario" name="horario" class="form-control" required>
                </div>
                <div class="col-12 col-md-6">
                <label for="datahora" class="form-label">Data e Hora:</label>
                <input type="datetime-local" id="datahora" name="datahora" class="form-control" required>
                </div>

                </fieldset>

                <fieldset>
                <legend>Preferências</legend>
                <label for="cor" class="form-label">Cor:</label>
                <input type="color" id="cor" name="cor" class="form-control" required>

                <label for="nivel" class="form-label">Nível de Interesse:</label>
                <input type="range" id="nivel" name="nivel" class="form-range" required>

                <label for="modalidade" class="form-label">Modalidade de Participação:</label>
                <div class="form-check">
                    <input type="radio" id="modalidade1" name="modalidade" value="presencial" class="form-check-input" required>
                    <label for="modalidade1">Presencial</label>
                    </div>
                    <div class="form-check">
                    <input type="radio" id="modalidade2" name="modalidade" value="online" class="form-check-input" >
                    <label for="modalidade2">Online</label>
                    </div>
                    <div class="form-check">
                    <input type="radio" id="modalidade3" name="modalidade" value="hibrido" class="form-check-input" >
                    <label for="modalidade3">Híbrido</label>
                </div>

                <label for="interesses" class="form-label">Interesses:</label>
                          <div class="form-check">
    <input type="checkbox" id="interesse1" name="interesses" value="ia" class="form-check-input">
    <label for="interesse1">Inteligência Artificial</label>
</div>

<div class="form-check">
    <input type="checkbox" id="interesse2" name="interesses" value="web" class="form-check-input">
    <label for="interesse2">Desenvolvimento Web</label>
</div>

<div class="form-check">
    <input type="checkbox" id="interesse3" name="interesses" value="robotica" class="form-check-input">
    <label for="interesse3">Robótica</label>
</div>

<div class="form-check">
    <input type="checkbox" id="interesse4" name="interesses" value="banco" class="form-check-input">
    <label for="interesse4">Banco de Dados</label>
</div>
                
            </fieldset>

            <fieldset>
                <legend>Projeto</legend>
                <label for="arquivo" class="form-label">Arquivo:</label>
                <input type="file" id="arquivo" name="arquivo" class="form-control" accept=".pdf,.zip,.pptx" required>

                <label for="categoria" class="form-label">Categoria:</label>
                <select name="categoria" id="categoria" class="form-select" required>
                    <option value="">Selecione uma categoria</option>
                    <option value="ia">Inteligencia artificial</option>
                    <option value="web">Desenvolvimento Web</option>
                    <option value="robotica">Robotica</option>
                    <option value="bd">Banco de dados</option>
                
                </select>

                <label for="tecnologia" class="form-label">Tecnologia:</label>
                <input type="text" id="tecnologia" name="tecnologia" class="form-control" list="tecnologias" required>
                <datalist id="tecnologias">
                    <option value="HTML"></option>
                    <option value="CSS"></option>
                    <option value="JavaScript"></option>
                    <option value="Java"></option>
                    <option value="Python"></option>
                </datalist>
                <div class="col-12">
                    <label for="descricao" class="form-label">Descrição:</label>
                    <textarea id="descricao" name="descricao" class="form-control" required></textarea>
                </div>
            </fieldset>
            <button type="submit" class="btn btn-primary">Enviar Formulario</button>
            <button type="reset" class="btn btn-secondary">Limpar formulário</button>
            <button type="button" class="btn btn-info">Mais informações</button>
            <input type="image" src="img/enviar.png" alt="Enviar formulário">
        </form>

        </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
